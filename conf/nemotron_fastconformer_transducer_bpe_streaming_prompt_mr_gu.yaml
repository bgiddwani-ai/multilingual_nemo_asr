# Cache-aware streaming FastConformer-Transducer (RNNT-only) ASR model with prompt support
# Combines cache-aware streaming encoder with prompt-based multilingual capability
# This is the RNNT-only variant (no auxiliary CTC head).

# You may find more detail:
# FastConformer here: https://docs.nvidia.com/deeplearning/nemo/user-guide/docs/en/stable/asr/models.html#fast-conformer
# Cache-aware Conformer here: https://docs.nvidia.com/deeplearning/nemo/user-guide/docs/en/stable/asr/models.html#cache-aware-streaming-conformer

name: "mr_gu_nemotron_pretraining"
init_from_nemo_model:
  model0:
    path: "/home/multilingual_nemo_asr/models/nemotron-3.5-asr-streaming-0.6b/nemotron-3.5-asr-streaming-0.6b.nemo"
    include: ['encoder']
    exclude: ['decoder', 'joint']

model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: false

  model_defaults:
    enc_hidden: 1024
    pred_hidden: 640
    joint_hidden: 640
    initialize_prompt_feature: true
    num_prompts: 6
    norm: None
    prompt_dictionary: {
    'mr': 0,
    'gu': 1,
    'auto': 2
    }

  #Update (#PATH)
  dataset_path: /data/dataset/indicvoices/train
  valid_dataset_path: /data/dataset/indicvoices/valid
  train_ds:
    # manifest_filepath: ??
    sample_rate: ${model.sample_rate}
    use_lhotse: true
    skip_missing_manifest_entries: true
    tarred_audio_filepaths: #Update (#PATH)
      - ${model.dataset_path}/train/mr_tarred/audio__OP_0..255_CL_.tar
      - ${model.dataset_path}/train/gu_tarred/audio__OP_0..255_CL_.tar
    # batch_duration: 400
    # quadratic_duration: 15
    # num_buckets: 30
    shuffle: true
    is_tarred: true
    num_workers: 8
    pin_memory: true
    batch_size: 16
    bucketing_strategy: "synced_randomized"
    concat_sampling_technique: "temperature"
    concat_sampling_temperature: 2.0
    defer_setup: true
    is_concat: true
    max_duration: 30
    min_duration: 0.025
    shard_manifests: true
    shuffle_n: 2048
    # slice_length: 100
    # bucketing_batch_size: null
    # bucket_buffer_size: 10000
    # shuffle_buffer_size: 10000
    prompt_dictionary: ${model.model_defaults.prompt_dictionary}
    num_prompts: ${model.model_defaults.num_prompts}
    subsampling_factor: ${model.encoder.subsampling_factor}
    lang_field: lang

    # Per-dataset prompt mode — controls how language prompts are selected during training.
    # The mode is set per data source via lhotse input_cfg tags:
    #   tags: { prompt_mode: unified }
    #
    # Supported prompt_mode values:
    #   "langID"  — always pass the real language ID (use for AST / language-forced tasks)
    #   "auto"    — always pass auto/language-agnostic prompt (use for code-switching)
    #   "unified" — randomly choose auto vs lang ID (use for multilingual ASR, default)
    #
    # unified_auto_ratio controls the probability of selecting auto in "unified" mode.
    prompt_mode_field: prompt_mode
    default_prompt_mode: unified
    unified_auto_ratio: 0.5

  validation_ds:
    manifest_filepath:  #Update (#PATH)
      - ${model.valid_dataset_path}/mr_manifest.json
      - ${model.valid_dataset_path}/gu_manifest.json
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: true
    num_workers: 2
    pin_memory: true
    batch_duration: null
    use_lhotse: false
    use_bucketing: false
    prompt_dictionary: ${model.model_defaults.prompt_dictionary}
    num_prompts: ${model.model_defaults.num_prompts}
    subsampling_factor: ${model.encoder.subsampling_factor}
    lang_field: lang

  # test_ds:
  #   manifest_filepath: null
  #   sample_rate: ${model.sample_rate}
  #   batch_size: 16
  #   shuffle: false
  #   use_start_end_token: false
  #   num_workers: 8
  #   pin_memory: true
  #   use_lhotse: true
  #   use_bucketing: false
  #   prompt_dictionary: ${model.model_defaults.prompt_dictionary}
  #   num_prompts: ${model.model_defaults.num_prompts}
  #   subsampling_factor: ${model.encoder.subsampling_factor}
  #   lang_field: lang
  #   default_prompt_mode: langID

  tokenizer: #Update (#PATH)
    dir: /home/multilingual_nemo_asr/models/mr_gu_nemotron_tokenizer/tokenizer_spe_bpe_v1024
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "NA"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 128
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 42
    d_model: 1024
    use_bias: false

    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: true

    reduction: null
    reduction_position: null
    reduction_factor: 1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [[56,13],[56,6],[56,3],[56,1],[56,0]]
    # att_context_size: [56,13]
    att_context_probs: null
    att_context_style: chunked_limited
    xscaling: false
    untie_biases: true
    pos_emb_max_len: 5000

    conv_kernel_size: 9
    conv_norm_type: 'layer_norm'
    conv_context_size: causal

    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true

    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 2
      t_max: null
      dropout: 0.2

  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false

    fuse_loss_wer: true
    fused_batch_size: 2

    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  decoding:
    strategy: "greedy_batch"
    # Strip language-ID tags (e.g. <en-US>) from decoded output during inference.
    strip_lang_tags: true

    greedy:
      max_symbols: 10

    beam:
      beam_size: 2
      return_best_hypothesis: False
      score_norm: true
      tsd_max_sym_exp: 50
      alsd_max_target_len: 2.0

  interctc:
    loss_weights: []
    apply_at_layers: []

  loss:
    loss_name: "default"

    warprnnt_numba_kwargs:
      fastemit_lambda: 5e-3
      clamp: -1.0

  variational_noise:
    start_step: 0
    std: 0.0

  optim:
    name: adamw
    lr: 2.0
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: NoamAnnealing
      d_model: 1024
      warmup_steps: 10000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: -1
  max_steps: 150000
  val_check_interval: 25000 # Set to 0.25 to check 4 times per epoch, or an int for number of iterations
  limit_train_batches: 25000
  accelerator: auto
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  precision: bf16-mixed
  log_every_n_steps: 100
  enable_progress_bar: True
  num_sanity_val_steps: 0
  sync_batchnorm: true
  enable_checkpointing: False
  logger: false
  benchmark: false
  use_distributed_sampler: false

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 50
    always_save_nemo: True
  resume_from_checkpoint: null # The path to a checkpoint file to continue the training, restores the whole state including the epoch, step, LR schedulers, apex, etc.
  # you need to set these two to True to continue the training
  resume_if_exists: false
  resume_ignore_no_checkpoint: false

  explicit_log_dir: /data/results/experiments/${name}
  # You may use this section to create a W&B logger
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${name}
    project: ${project_name}
